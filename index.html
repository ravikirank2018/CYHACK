<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Incident Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 10px;
            padding: 20px;
        }
        .sidebar {
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 20px;
        }
        .main-content {
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 20px;
        }
        .chart {
            height: 300px;
            margin-bottom: 20px;
        }
        .alert-box {
            background-color: #ffcccc;
            border: 1px solid #ff0000;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Cyber Incident Dashboard</h1>
    </header>
    <div class="container">
        <div class="sidebar">
            <h2>Incident Details</h2>
            <ul>
                <li>Attack Type: Ransomware</li>
                <li>Region: North America</li>
                <li>Severity: High</li>
            </ul>
            <div class="alert-box">
                <strong>Alert:</strong> New incident detected in Europe!
            </div>
        </div>
        <div class="main-content">
            <div id="map" class="chart">
                <h3>Interactive Map</h3>
                <p>(Static placeholder for a map)</p>
            </div>
            <div id="bar-chart" class="chart">
                <h3>Incident Statistics</h3>
                <p>(Static placeholder for a bar chart)</p>
            </div>
        </div>
    </div>
    <script>
        // Example of a glowing circle animation (for map points)
        const mapElement = document.getElementById('map');
        mapElement.innerHTML += '<div style="width: 20px; height: 20px; background: red; border-radius: 50%; box-shadow: 0 0 15px red; animation: pulse 1.5s infinite;"></div>';

        // Animation for glowing effect
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes pulse {
                0% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.2); opacity: 0.7; }
                100% { transform: scale(1); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // Simulate data update
        setTimeout(() => {
            const alertBox = document.querySelector('.alert-box');
            alertBox.innerHTML = '<strong>Alert:</strong> New incident detected in Asia!';
        }, 5000);
    </script>
</body>
</html>
