<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Payment Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.3.2/jsQR.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background-color: #343a40;
        }
        .navbar a {
            color: white !important;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #343a40;
            color: white;
            padding: 15px;
            position: fixed;
            top: 56px;
        }
        .main-content {
            margin-left: 260px;
            padding: 20px;
            width: 100%;
            margin-top: 60px;
        }
        .card {
            margin-bottom: 20px;
        }
        #qr-video {
            width: 100%;
            max-height: 250px;
            border: 2px solid #28a745;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">QR Payment</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Help Desk</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul class="nav flex-column">
            <li class="nav-item"><a href="#" class="nav-link text-white">Home</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-white" onclick="fetchReports()">Transaction Reports</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-white" onclick="detectFraud()">Fraud Detection</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Dashboard</h1>

        <div class="row">
            <div class="col-md-6">
                <h3>QR Scanner</h3>
                <video id="qr-video" autoplay></video>
                <button class="btn btn-success mt-2" onclick="startQRScanner()">Start Scanner</button>
                <p id="qr-result" class="mt-2"></p>
            </div>
            <div class="col-md-6">
                <h3>AI Assistant</h3>
                <textarea id="ai-input" class="form-control" placeholder="Ask me anything..."></textarea>
                <button class="btn btn-primary mt-2" onclick="sendMessage()">Send</button>
                <p id="ai-response" class="mt-2"></p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <h3>Transaction Reports</h3>
                <ul id="report-list" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script>
        async function fetchReports() {
            const response = await fetch('/reports');
            const data = await response.json();
            const reportList = document.getElementById('report-list');
            reportList.innerHTML = "";
            data.forEach(tx => {
                const item = document.createElement('li');
                item.className = "list-group-item";
                item.textContent = `Transaction: $${tx.amount}, Status: ${tx.status}`;
                reportList.appendChild(item);
            });
        }

        async function detectFraud() {
            const response = await fetch('/fraud-detection');
            const data = await response.json();
            alert(`Fraudulent Transactions Detected: ${data.length}`);
        }

        async function sendMessage() {
            const message = document.getElementById('ai-input').value;
            const response = await fetch('/ai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            document.getElementById('ai-response').textContent = data.reply;
        }

        function startQRScanner() {
            const video = document.getElementById('qr-video');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                    scanQRCode(video);
                })
                .catch(err => console.error("Error accessing camera: ", err));
        }

        function scanQRCode(video) {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            setInterval(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height);
                if (code) {
                    document.getElementById("qr-result").textContent = `QR Code: ${code.data}`;
                    sendQRData(code.data);
                }
            }, 500);
        }

        async function sendQRData(qrData) {
            const response = await fetch('/scan-qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_code_data: qrData })
            });
            const data = await response.json();
            alert(data.message);
        }
    </script>
</body>
</html>
